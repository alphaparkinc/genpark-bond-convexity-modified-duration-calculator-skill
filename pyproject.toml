[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-bond-convexity-modified-duration-calculator-skill"
version = "1.0.0"
description = "Fixed-income bond pricing engine computing cash flow present values, Macaulay duration, modified duration, and price convexity."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
